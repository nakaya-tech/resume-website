<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>雪里的小世界</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <script src="main.js?v=1.2" defer></script>
</head>
<body class="theme-day">
    <div class="splash">
        <div class="splash__bg"></div>
        <header class="splash__header">
            <span class="splash__logo-dot"></span>
            <div class="splash__header-right">
                <div class="splash__theme">
                    <button id="theme-toggle" class="theme-toggle" onclick="toggleTheme()">
                        <span class="theme-toggle__icon" id="theme-icon">☀️</span>
                        <span class="theme-toggle__text">切换主题</span>
                    </button>
                </div>
            </div>
        </header>

        <main class="splash__content">
            <div class="splash__avatar">
                <div class="splash__avatar-inner" style="background-image: url('images/avatar.jpg'); background-size: cover; background-position: center; color: transparent;">武</div>
            </div>
            <h1 class="splash__title">欢迎来到雪里的小世界</h1>
            <div class="splash__quote-container" id="quote-container">
                <p class="splash__quote" id="quote-text">
                    道阻且长，行则将至；行而不辍，未来可期。
                </p>
            </div>

            <div class="btn splash__clock" id="welcome-clock">--:--</div>

            <a href="space.html" class="btn btn--primary splash__button">
                <span>进入小世界</span>
                <span class="btn__icon">→</span>
            </a>
        </main>

        <footer class="splash__footer">
            <span>进入[我的小世界]了解更多</span>
        </footer>
    </div>
    
    <!-- 音乐播放器 -->
    <div class="music-player" id="musicPlayer">
        <div class="player-toggle" id="playerToggle" onclick="togglePlayer()">
            <div class="record-player">
                <div class="vinyl" id="vinyl">
                    <div class="vinyl-center"></div>
                </div>
                <div class="needle"></div>
            </div>
        </div>
        <div class="player-content" id="playerContent">
            <div class="player-header">
                <div class="song-info">
                    <div class="song-name-container">
                        <span class="song-name" id="songName">未播放歌曲</span>
                    </div>
                    <div class="song-artist" id="songArtist">-</div>
                </div>
            </div>
            <div class="player-controls">
                <button class="control-btn" id="prevBtn" onclick="prevSong()">
                    <span class="btn-icon">⏮</span>
                </button>
                <button class="control-btn main-btn" id="playBtn" onclick="togglePlay()">
                    <span class="btn-icon" id="playIcon">▶</span>
                </button>
                <button class="control-btn" id="nextBtn" onclick="nextSong()">
                    <span class="btn-icon">⏭</span>
                </button>
            </div>
            <div class="player-progress">
                <div class="progress-bar" id="progressBar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="progress-time">
                    <span class="time-current" id="currentTime">0:00</span>
                    <span class="time-divider">/</span>
                    <span class="time-total" id="totalTime">0:00</span>
                </div>
            </div>
        </div>
    </div>
    <audio id="bg-music">
        <source src="music/background.mp3" type="audio/mpeg">
    </audio>
</body>
</html>
